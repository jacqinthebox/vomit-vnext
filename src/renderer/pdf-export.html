<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Export</title>
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/highlight.css" />
    <link rel="stylesheet" href="css/katex.min.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: white;
        color: #333;
      }

      .slide-page {
        width: 297mm;
        height: 210mm;
        padding: 16mm 20mm;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        break-after: page;
        break-inside: avoid;
        page-break-after: always;
        page-break-inside: avoid;
      }

      .slide-page:last-child {
        break-after: auto;
        page-break-after: avoid;
      }

      .slide-content {
        width: 100%;
        transform-origin: center center;
      }

      #slides-container.document-export .slide-page {
        width: auto;
        height: auto;
        min-height: 0;
        padding: 0 20mm;
        overflow: visible;
        display: block;
        break-after: auto;
        page-break-after: auto;
      }

      #slides-container.document-export .slide-number {
        display: none;
      }

      #slides-container.document-export .slide-content img {
        max-height: 250mm;
      }

      .slide-content h1 {
        font-size: 2.5em;
        font-weight: 600;
        margin-bottom: 0.5em;
        color: #333;
      }

      .slide-content h2 {
        font-size: 2em;
        font-weight: 500;
        margin-bottom: 0.5em;
        color: #555;
      }

      .slide-content h3 {
        font-size: 1.5em;
        font-weight: 500;
        margin-bottom: 0.5em;
        color: #555;
      }

      .slide-content p {
        font-size: 1.2em;
        line-height: 1.6;
        margin-bottom: 0.8em;
      }

      .slide-content ul,
      .slide-content ol {
        font-size: 1.2em;
        line-height: 1.8;
        margin-left: 1.5em;
        margin-bottom: 0.8em;
      }

      .slide-content li {
        margin-bottom: 0.3em;
      }

      .slide-content blockquote {
        font-size: 1.1em;
        padding: 1em 1.5em;
        border-left: 4px solid #4a90d9;
        background: #f5f5f5;
        margin: 1em 0;
      }

      .slide-content code {
        font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
        font-size: 0.9em;
        padding: 0.2em 0.4em;
        background: #f0f0f0;
        border-radius: 3px;
      }

      .slide-content pre {
        font-size: 0.9em;
        padding: 1em;
        background: #f5f5f5;
        border-radius: 6px;
        overflow-x: auto;
        margin: 1em 0;
      }

      .slide-content pre code {
        padding: 0;
        background: none;
      }

      .slide-content img {
        max-width: 100%;
        max-height: 50vh;
        object-fit: contain;
        display: block;
        margin: 1em auto;
      }

      .slide-content table {
        width: 100%;
        border-collapse: collapse;
        font-size: 1em;
        margin: 1em 0;
      }

      .slide-content th,
      .slide-content td {
        padding: 8px 12px;
        border: 1px solid #ddd;
        text-align: left;
      }

      .slide-content th {
        background: #f5f5f5;
        font-weight: 600;
      }

      #slides-container.document-export h1,
      #slides-container.document-export h2,
      #slides-container.document-export h3 {
        break-after: avoid;
        page-break-after: avoid;
      }

      #slides-container.document-export img,
      #slides-container.document-export pre,
      #slides-container.document-export blockquote,
      #slides-container.document-export table {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .slide-number {
        position: absolute;
        bottom: 20px;
        right: 30px;
        font-size: 0.9em;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div id="slides-container"></div>

    <script src="js/marked.min.js"></script>
    <script src="js/highlight.min.js"></script>
    <script src="js/hljs-powershell.min.js"></script>
    <script src="js/highlight-terraform.js"></script>
    <script src="js/katex.min.js"></script>
    <script src="js/katex-auto-render.min.js"></script>
    <script src="js/frontmatter.js"></script>
    <script src="js/slideParser.js"></script>
    <script>
      let basePath = null;

      function parseSlides(content) {
        const markdown = window.Frontmatter.strip(content || '').trim();
        return window.SlideParser.parseSlides(markdown);
      }

      function renderMarkdown(text) {
        let processed = text.replace(
          /!\[([^\]]*)\]\(([^)\s]+)\s*=(\d*)x(\d*)\)/g,
          (match, alt, src, width, height) => {
            let style = '';
            if (width) style += `width:${width}px;`;
            if (height) style += `height:${height}px;`;
            let resolvedSrc = src;
            if (
              basePath &&
              !src.startsWith('http') &&
              !src.startsWith('file://') &&
              !src.startsWith('data:')
            ) {
              resolvedSrc = `file://${basePath}/${src}`;
            }
            return `<img src="${resolvedSrc}" alt="${alt}" style="${style}">`;
          },
        );

        processed = processed.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (match, alt, src) => {
          if (src.includes('=')) return match;
          let resolvedSrc = src;
          if (
            basePath &&
            !src.startsWith('http') &&
            !src.startsWith('file://') &&
            !src.startsWith('data:')
          ) {
            resolvedSrc = `file://${basePath}/${src}`;
          }
          return `![${alt}](${resolvedSrc})`;
        });

        if (window.marked) {
          return window.marked.parse(processed);
        }
        return processed;
      }

      function renderSlides(content, bp) {
        basePath = bp;
        const slides = parseSlides(content);
        const container = document.getElementById('slides-container');
        const isDocumentExport = slides.length === 1;

        window.pdfIsDocumentExport = isDocumentExport;
        container.classList.toggle('document-export', isDocumentExport);
        container.innerHTML = slides
          .map((slide, index) => {
            const html = renderMarkdown(slide.content);
            return `<div class="slide-page"><div class="slide-content">${html}</div><div class="slide-number">${index + 1} / ${slides.length}</div></div>`;
          })
          .join('');

        // Highlight code blocks
        container.querySelectorAll('pre code').forEach((block) => {
          if (window.hljs) window.hljs.highlightElement(block);
        });

        // Render LaTeX math
        if (window.renderMathInElement) {
          window.renderMathInElement(container, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\[', right: '\\]', display: true },
              { left: '\\(', right: '\\)', display: false },
            ],
            throwOnError: false,
          });
        }

        const images = Array.from(container.querySelectorAll('img'));
        const imageLoads = images.map((image) => {
          if (image.complete) return Promise.resolve();
          return new Promise((resolve) => {
            image.addEventListener('load', resolve, { once: true });
            image.addEventListener('error', resolve, { once: true });
          });
        });

        Promise.all([document.fonts.ready, ...imageLoads]).then(() => {
          if (!isDocumentExport) {
            container.querySelectorAll('.slide-page').forEach((page) => {
              const content = page.querySelector('.slide-content');
              const style = window.getComputedStyle(page);
              const availableWidth =
                page.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
              const availableHeight =
                page.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
              const scale = Math.min(
                1,
                availableWidth / content.scrollWidth,
                availableHeight / content.scrollHeight,
              );
              content.style.transform = `scale(${scale})`;
            });
          }
          window.pdfReady = true;
        });
      }

      // Listen for content via custom event (from preload)
      window.addEventListener('vomit:render-for-pdf', (e) => {
        const { content, basePath: bp } = e.detail;
        renderSlides(content, bp);
      });
    </script>
  </body>
</html>
