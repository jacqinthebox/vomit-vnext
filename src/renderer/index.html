<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file: blob: vomit-file: https://www.plantuml.com; object-src 'self' data: file: vomit-file:; frame-src 'self' data: file: vomit-file:;">
  <title>Vomit</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/highlight.css">
  <link rel="stylesheet" href="css/codemirror.css">
  <link rel="stylesheet" href="css/codemirror-dialog.css">
  <link rel="stylesheet" href="css/codemirror-show-hint.css">
  <link rel="stylesheet" href="css/katex.min.css">
  <link rel="stylesheet" href="css/xterm.css">
</head>
<body class="theme-default">
  <div id="app">
    <div id="main-container">
      <div id="sidebar-files" class="sidebar">
        <div class="sidebar-header"><span id="sidebar-folder-name">FILES</span><span class="bucket-icon" title="Bucket"><span class="bucket-icon-default">🪣</span><span class="bucket-icon-cherry">🍒</span></span></div>
        <div id="file-tree"></div>
      </div>
      <div id="sidebar-outline" class="sidebar hidden">
        <div class="sidebar-header">Outline</div>
        <div id="outline-list"></div>
      </div>
      <div id="sidebar-search" class="sidebar hidden">
        <div class="sidebar-header">Search</div>
        <div class="search-input-container">
          <input type="text" id="search-input" placeholder="Search in files...">
        </div>
        <div id="search-results"></div>
      </div>
      <div id="sidebar-tags" class="sidebar hidden">
        <div class="sidebar-header">Tags</div>
        <div id="tag-list"></div>
      </div>
      <div id="sidebar-todos" class="sidebar hidden">
        <div class="sidebar-header">Todos</div>
        <div id="todo-list"></div>
      </div>
      <div id="sidebar-resize"></div>
      <div id="editor-wrapper">
        <div id="tab-bar"></div>
        <div id="editor-container">
          <div id="editor-pane">
            <div id="editor"></div>
          </div>
          <div id="preview-pane" tabindex="0">
            <div id="preview"></div>
          </div>
        </div>
      </div>
      <div id="right-sidebar-resize" class="hidden"></div>
      <div id="right-outline" class="right-sidebar hidden">
        <div class="sidebar-tabs">
          <button class="sidebar-tab active" data-tab="outline">Outline</button>
          <button class="sidebar-tab" data-tab="backlinks">Backlinks</button>
        </div>
        <div class="sidebar-tab-pane active" data-pane="outline">
          <div id="right-outline-list"></div>
        </div>
        <div class="sidebar-tab-pane" data-pane="backlinks">
          <div id="right-backlinks-list"></div>
        </div>
      </div>
    </div>

    <div id="terminal-panel" class="hidden">
      <div id="terminal-resize"></div>
      <div id="terminal-header">
        <div class="terminal-tabs">
          <button class="terminal-tab active" data-terminal="pi">Pi</button>
          <button class="terminal-tab" data-terminal="ai">Vomit AI</button>
          <button class="terminal-tab" data-terminal="shell">Shell</button>
        </div>
        <div class="terminal-actions">
          <button id="terminal-clear" title="Clear">Clear</button>
          <button id="terminal-detach" title="Detach terminal" class="terminal-detach-btn">⧉</button>
          <button id="terminal-stop" title="Stop" class="hidden">Stop</button>
          <button id="terminal-close" title="Close">&times;</button>
        </div>
      </div>
      <!-- AI Terminal Content -->
      <div id="ai-terminal-content" class="terminal-content">
        <div id="terminal-output"></div>
        <div id="terminal-context-bar"></div>
        <div id="terminal-input-container">
          <span class="terminal-prompt">❯</span>
          <input type="text" id="terminal-input" placeholder="Ask AI... (use /doc to include document)" autocomplete="off">
        </div>
      </div>
      <!-- Shell Terminal Content -->
      <div id="shell-terminal-content" class="terminal-content">
        <div id="shell-terminal-container"></div>
      </div>
      <!-- Pi Terminal Content -->
      <div id="pi-terminal-content" class="terminal-content active">
        <div id="pi-terminal-container"></div>
      </div>
    </div>

    <div id="statusbar">
      <span id="status-file">Untitled</span>
      <span id="status-slides">0 slides</span>
      <span id="status-words">0 words</span>
      <span id="status-version"></span>
    </div>
    <div id="toast-container"></div>

    <!-- Wiki graph modal -->
    <div id="wiki-graph-modal" class="modal-overlay wiki-graph-modal hidden">
      <div class="modal-panel wiki-graph-panel">
        <div class="modal-header">
          <span>Wiki Graph</span>
          <label class="wiki-graph-toggle">
            <input type="checkbox" id="wiki-graph-hide-orphans" />
            Hide orphans
          </label>
          <button id="wiki-graph-close" class="modal-close" aria-label="Close">&times;</button>
        </div>
        <div id="wiki-graph-canvas" class="wiki-graph-canvas"></div>
        <div class="modal-footer wiki-graph-footer">
          <span id="wiki-graph-stats"></span>
          <span class="wiki-graph-hint">Click a node to open · drag header to move · resize from bottom-right · double-click header to reset</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/marked.min.js"></script>
  <script src="js/highlight.min.js"></script>
  <script src="js/hljs-bash.min.js"></script>
  <script src="js/hljs-yaml.min.js"></script>
  <script src="js/hljs-python.min.js"></script>
  <script src="js/hljs-json.min.js"></script>
  <script src="js/hljs-typescript.min.js"></script>
  <script src="js/hljs-go.min.js"></script>
  <script src="js/hljs-dockerfile.min.js"></script>
  <script src="js/hljs-sql.min.js"></script>
  <script src="js/hljs-csharp.min.js"></script>
  <script src="js/hljs-lua.min.js"></script>
  <script src="js/hljs-powershell.min.js"></script>
  <script src="js/highlight-terraform.js"></script>
  <script src="js/codemirror.min.js"></script>
  <script src="js/codemirror-meta.min.js"></script>
  <script src="js/codemirror-overlay.min.js"></script>
  <script src="js/codemirror-xml.min.js"></script>
  <script src="js/codemirror-markdown.min.js"></script>
  <script src="js/codemirror-javascript.min.js"></script>
  <script src="js/codemirror-css.min.js"></script>
  <script src="js/codemirror-htmlmixed.min.js"></script>
  <script src="js/codemirror-python.min.js"></script>
  <script src="js/codemirror-yaml.min.js"></script>
  <script src="js/codemirror-shell.min.js"></script>
  <script src="js/codemirror-go.min.js"></script>
  <script src="js/codemirror-sql.min.js"></script>
  <script src="js/codemirror-clike.min.js"></script>
  <script src="js/codemirror-lua.min.js"></script>
  <script src="js/codemirror-simple.min.js"></script>
  <script src="js/codemirror-dockerfile.min.js"></script>
  <script src="js/codemirror-terraform.js"></script>
  <script src="js/codemirror-powershell.min.js"></script>
  <script src="js/codemirror-mode-aliases.js"></script>
  <script src="js/codemirror-gfm.min.js"></script>
  <script src="js/codemirror-yaml-frontmatter.min.js"></script>
  <script src="js/codemirror-dialog.min.js"></script>
  <script src="js/codemirror-searchcursor.min.js"></script>
  <script src="js/codemirror-search.min.js"></script>
  <script src="js/katex.min.js"></script>
  <script src="js/katex-auto-render.min.js"></script>
  <script src="js/plantuml-encoder.min.js"></script>
  <script src="js/mermaid.min.js"></script>
  <script src="js/codemirror-show-hint.min.js"></script>
  <script src="js/codemirror-anyword-hint.min.js"></script>
  <script src="js/hints.js"></script>
  <script src="js/wikilink-hint.js"></script>
  <script src="js/vis-network.min.js"></script>
  <script src="js/emoji.js"></script>
  <script src="js/xterm.min.js"></script>
  <script src="js/xterm-addon-fit.min.js"></script>
  <script src="js/pathUtils.js"></script>
  <script src="js/frontmatter.js"></script>
  <script src="js/state/editorState.js"></script>
  <script src="js/hosts/codemirrorHost.js"></script>
  <script src="js/features/formatting.js"></script>
  <script src="js/features/search.js"></script>
  <script src="js/features/preview.js"></script>
  <script src="js/features/backlinks.js"></script>
  <script src="js/features/wikiGraph.js"></script>
  <script src="js/features/terminal-commands.js"></script>
  <script src="js/features/terminal.js"></script>
  <script src="js/state/fileTreeState.js"></script>
  <script src="js/features/treeDataModel.js"></script>
  <script src="js/features/treeView.js"></script>
  <script src="js/features/fileTree.js"></script>
  <script src="js/features/gitGutter.js"></script>
  <script src="js/features/gitBadges.js"></script>
  <script src="js/features/tagExplorer.js"></script>
  <script src="js/features/todoExplorer.js"></script>
  <script src="js/features/settings.js"></script>
  <script src="js/features/commandPalette.js"></script>
  <script src="js/features/inlineImages.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
