<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Purple rounded square - 850px (~83% of canvas) -->
  <rect x="87" y="87" width="850" height="850" rx="155" ry="155" fill="#8b5cf6"/>

  <!-- Vomit face in white -->
  <g fill="white">
    <!-- Face circle -->
    <circle cx="512" cy="512" r="232" fill="none" stroke="white" stroke-width="35"/>

    <!-- Left eye (X shaped - sick) -->
    <line x1="396" y1="438" x2="466" y2="508" stroke="white" stroke-width="31" stroke-linecap="round"/>
    <line x1="466" y1="438" x2="396" y2="508" stroke="white" stroke-width="31" stroke-linecap="round"/>

    <!-- Right eye (X shaped - sick) -->
    <line x1="558" y1="438" x2="628" y2="508" stroke="white" stroke-width="31" stroke-linecap="round"/>
    <line x1="628" y1="438" x2="558" y2="508" stroke="white" stroke-width="31" stroke-linecap="round"/>

    <!-- Open mouth -->
    <ellipse cx="512" cy="608" rx="72" ry="56" fill="white"/>
  </g>
</svg>
